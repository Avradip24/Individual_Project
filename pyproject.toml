[project]
name = "individual-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "joblib>=1.5.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "path>=17.1.1",
    "pyarrow>=25.0.1",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=6.0.0",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.4",
]

[tool.ruff]
target-version = "py312"
line-length = 88
select = ["E", "F", "I", "N", "UP"] # Errors, Flakes, Isort, Naming, PyUpgrade

[tool.ruff.lint]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = ["src"]
